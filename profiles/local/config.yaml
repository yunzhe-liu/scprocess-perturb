# ==============================================================================
# Local Execution Profile
# ==============================================================================
# For pure local multi-core execution (no SLURM / cluster scheduler).
# Usage: snakemake --profile profiles/local
# ==============================================================================

# Use local executor (no cluster submission)
executor: local

# Default core count (from config.yaml)
cores: 8

# Print shell commands to log
printshellcmds: true

# Create and activate each rule's declared environment.
use-conda: true
conda-frontend: conda

# NFS filesystem latency tolerance
latency-wait: 60

# Do not retry failed jobs
restart-times: 0

# Stop on first error (do not keep going)
keep-going: false

# Rerun triggers
rerun-triggers:
  - mtime
  - params
  - input
  - software-env
  - code
