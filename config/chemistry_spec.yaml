# ==============================================================================
# chemistry_spec.yaml — Single Source of Truth for 10x Chemistry Parameters
# ==============================================================================
# Every entry maps a user-facing tenx_chemistry key to all downstream parameters
# needed by simpleaf, HAM, whitelist translation, and merge.
#
# Adding a new chemistry: copy the closest existing entry and adjust the fields.
#
# Fields:
#   af_chemistry      — simpleaf --chemistry argument (or base if override present)
#   whitelist          — 10x barcode whitelist filename (auto-downloaded if needed)
#   expected_ori       — expected orientation for alevin-fry ("fw" or "rc")
#   translation        — whether Feature↔GEX barcode translation is needed
#                        (True for dual-oligo systems like cs1/cs2 bead capture;
#                         False for single-oligo systems like soluble RT primer)
#   geometry_override  — explicit piscem geometry string, bypassing __builtin handler
#                        (null = use af_chemistry's default geometry)
#   ham_chemistry      — HAM chemistry name (maps to CHEMISTRY_CONFIGS in HAM)
#   umi_len            — UMI length in bp (12 for v3 chemistries, 10 for 5' v1/v2)
#
# NOTE: Indirect capture methods (e.g. 3' v2 with GBC) are NOT supported.
# The protospacer must be present in the guide FASTQ R2 for direct capture.
# ==============================================================================

3v3:
  af_chemistry: "10xv3"
  whitelist: "3M-february-2018.txt"
  expected_ori: "fw"
  translation: true
  geometry_override: null
  ham_chemistry: "10xv3"
  umi_len: 12

