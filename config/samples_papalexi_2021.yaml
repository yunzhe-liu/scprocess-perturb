# sgRNA FASTQ naming: papalexi_sgRNA_S1_L00{1-8}_R{1,2}_001.fastq.gz
# ==============================================================================

groups:
  lane_01:
    group_id: lane_01
    gex_h5: /data/yunzliu/papalexi_2021_benchmark/01_reference/papalexi_2021_rna.h5ad
    sgRNA_fastq_dir: /data/yunzliu/raw_fastq/papalexi_2021/sgRNA
    sgRNA_r1_pattern: "papalexi_sgRNA_S1_L00*_R1_001.fastq.gz"
    sgRNA_r2_pattern: "papalexi_sgRNA_S1_L00*_R2_001.fastq.gz"
