# ==============================================================================
# config.yaml — scprocess-perturb Global Configuration
# ==============================================================================
# Copy this file and edit paths to match your data layout.
# See README.md for full documentation of every parameter.
# ==============================================================================

# ── Paths ──
proj_dir: /path/to/scprocess-perturb
out_dir: /path/to/results
log_dir: /path/to/logs

# ── Chemistry ──
# 3v3 | 3v4 | 3LT | multiome | 5v1 | 5v2 | 5v3 | custom
tenx_chemistry: "3v3"

# ── Input data topology ──
# Path to the groups file that maps each 10x lane to its input files.
groups_file: config/groups.yaml

# ── Guide library ──
# CSV used to generate FASTA + t2g for guide quantification and to map
# assigned guide IDs to genes/constructs during assignment.
guide_csv: /path/to/guide_library.csv

# ── Guide extraction ──
guide_extraction:
  method: simpleaf                    # simpleaf (default) | hash_matcher

simpleaf:
  af_home: /path/to/alevin-fry

#   Optional overrides (defaults shown):
#   index:
#     kmer_length: 15
#     minimizer_length: 11
#   quant:
#     resolution: parsimony-gene      # parsimony-gene | cr-like
#     use_knee: false                 # true = knee calling (no whitelist needed)

# ── Alternative extraction method: HAM ──
# guide_extraction:
#   method: hash_matcher
# hash_matcher:
#   umi_threshold: 1
#   cb_max_hamming: 1

# ── Optional: override auto-derived paths ──
# All reference paths default to {out_dir}/refs/ unless set here.
# The workflow auto-generates FASTA, t2g, piscem index, and downloads
# 10x whitelists automatically from guide_csv.
# references:
#   guide_fasta: /path/to/guides.fasta
#   guide_t2g_2col: /path/to/t2g.tsv
#   sgRNA_index_dir: /path/to/piscem_index/
#   guide_hash: /path/to/guide_hash.pkl
#   whitelist_dir: /path/to/whitelist_cache/

# ── Optional: whitelist QC ──
# whitelist:
#   min_umi: 1000
#   min_genes: 500

# ── Optional: resource limits ──
# resources:
#   simpleaf_quant_threads: 12
#   simpleaf_index_threads: 4
#   hash_quant_threads: 4

# ── Guide assignment (v0.2.0+) ──
# Remove this entire section to produce guide_matrix/ only.
assignment:
  guide_design: dual                  # single | dual | multi
  methods:
    - pgmm_em
  #   Optional overrides (defaults shown):
  #   umi_threshold: 3
  #   prob_threshold: 0.75
  #   workers: 16
  #   max_em_iter: 200
  # - umi_threshold              # simple UMI >= threshold filter (default t=3)
  # - fishash                    # Fisher exact test (needs R + fishash package)

# ── Multimodal integration ──
# Produces one canonical perturbation_adata.h5ad artifact.
integration:
  input_kind: auto                    # auto | counts | standardized
  counts_layer: counts                # layer used for h5ad/h5mu inputs
  # counts_source: /path/to/aligned_counts.h5ad
  # normalized_source: /path/to/aligned_normalized.h5ad
  target_sum: 10000                   # used when normalization is computed
  max_materialized_nnz: 100000000     # switch to bounded CSR streaming above this
  stream_chunk_nnz: 50000000          # approximate per-block nnz limit
  max_input_nnz: 5000000000            # abort before processing above this
  max_output_gb: 250                   # abort if estimated output is larger
  min_free_disk_gb: 200                # reserve kept free after output estimate
  max_process_memory_gb: 192           # virtual-memory ceiling for integration

# ── Perturbation-status estimation ──
# Disabled by default because both supported methods are computationally heavy.
perturbation_status:
  method: none                         # none | mixscape | ps
  # perturbation_type: CRISPRi         # required for Mixscape: KO | CRISPRa | CRISPRi
  # shards: 4
  # max_workers: 1
  # memory_gb: 64
  # min_target_cells: 3
  # seed: 20260902

# ── QC and standardization ──
# Always runs after integration or the selected perturbation-status method.
# It validates and preserves X/counts; no cell or gene filtering is performed.
finalization:
  memory_gb: 16
  scan_chunk_values: 10000000
  max_input_gb: 300
  min_free_disk_gb: 100
