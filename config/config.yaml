# ==============================================================================
# config.yaml — scprocess-perturb Global Configuration
# ==============================================================================
# Copy this file and edit paths to match your data layout.
# See README.md for full documentation of every parameter.
# ==============================================================================

# ── Paths ──
proj_dir: /path/to/scprocess-perturb
out_dir: /path/to/results
log_dir: /path/to/logs

# ── Chemistry ──
# 3v3 | 3v4 | 3LT | multiome | 5v1 | 5v2 | 5v3 | custom
tenx_chemistry: "3v3"

# ── Input data topology ──
# Path to the groups file that maps each 10x lane to its input files.
groups_file: config/groups.yaml

# ── Guide library ──
# CSV used to generate FASTA + t2g for guide quantification and to map
# assigned guide IDs to genes/constructs during assignment.
guide_csv: /path/to/guide_library.csv

# ── Guide extraction ──
guide_extraction:
  method: simpleaf                    # simpleaf (default) | hash_matcher

simpleaf:
  af_home: /path/to/alevin-fry

#   Optional overrides (defaults shown):
#   index:
#     kmer_length: 15
#     minimizer_length: 11
#   quant:
#     resolution: parsimony-gene      # parsimony-gene | cr-like
#     use_knee: false                 # true = knee calling (no whitelist needed)

# ── Alternative extraction method: HAM ──
# guide_extraction:
#   method: hash_matcher
# hash_matcher:
#   umi_threshold: 1
#   cb_max_hamming: 1

# ── Optional: override auto-derived paths ──
# All reference paths default to {out_dir}/refs/ unless set here.
# The workflow auto-generates FASTA, t2g, piscem index, and downloads
# 10x whitelists automatically from guide_csv.
# references:
#   guide_fasta: /path/to/guides.fasta
#   guide_t2g_2col: /path/to/t2g.tsv
#   sgRNA_index_dir: /path/to/piscem_index/
#   guide_hash: /path/to/guide_hash.pkl
#   whitelist_dir: /path/to/whitelist_cache/

# ── Optional: whitelist QC ──
# whitelist:
#   min_umi: 1000
#   min_genes: 500

# ── Optional: resource limits ──
# resources:
#   simpleaf_quant_threads: 12
#   simpleaf_index_threads: 4
#   hash_quant_threads: 4

# ── Guide assignment (v0.2.0+) ──
# Remove this entire section to produce guide_matrix/ only.
assignment:
  guide_design: dual                  # single | dual | multi
  methods:
    - pgmm_em
  #   Optional overrides (defaults shown):
  #   umi_threshold: 3
  #   prob_threshold: 0.75
  #   workers: 16
  #   max_em_iter: 200
  # - umi_threshold              # simple UMI >= threshold filter (default t=3)
  # - fishash                    # Fisher exact test (needs R + fishash package)
