# ==============================================================================
# config.yaml — scprocess-perturb Global Configuration
# ==============================================================================
# Copy this file and edit paths to match your data layout.
# See README.md for full documentation of every parameter.
# ==============================================================================

# ── Paths ──
proj_dir: /path/to/scprocess-perturb
out_dir: /path/to/results
log_dir: /path/to/logs

# ── Chemistry (v0.1.2+) ──
# Single entry for all chemistry-dependent parameters. All downstream values
# (simpleaf chemistry, whitelist, translation, HAM chemistry, UMI length) are
# derived automatically from config/chemistry_spec.yaml.
tenx_chemistry: "3v3"
# Options: 3v3, 3v4, 3LT, 5v3, multiome, 5v1, 5v2, custom

# ── Chemistry field overrides (optional) ──
# Override individual fields from chemistry_spec.yaml without switching to
# custom mode. Useful when you have standard hardware but a non-standard
# parameter (e.g. a guide library with longer protospacers).
# chemistry_overrides:
#   umi_len: 11

# ── Input data topology file ──
# Path to the groups file that maps each 10x lane to its input files.
# Relative paths are resolved from the scprocess-perturb repository root.
groups_file: config/groups.yaml

# ── Quantification method ──
guide_extraction:
  method: simpleaf                     # "simpleaf" | "hash_matcher"

# ── Reference files ──
references:
  guide_fasta: /path/to/guides.fasta
  guide_t2g_2col: /path/to/t2g.tsv
  guide_hash: /path/to/guide_hash.pkl              # HAM only
  sgRNA_index_dir: /path/to/piscem_index/           # simpleaf only
  whitelist_dir: /path/to/whitelist_cache/
  # Optional — provide guide_csv to auto-generate FASTA + t2g:
  # guide_csv: /path/to/guide_library.csv
  # Required if translation=true (3' chemistries):
  # translation_table: /path/to/feature_barcode_translation.txt

# ── simpleaf settings (used when method=simpleaf) ──
simpleaf:
  af_home: /path/to/alevin-fry
  index:
    kmer_length: 15
    minimizer_length: 11
  quant:
    resolution: parsimony-gene         # "parsimony-gene" | "cr-like"
    use_knee: false                    # true = knee calling (no whitelist needed)

# ── HAM settings (used when method=hash_matcher) ──
hash_matcher:
  umi_threshold: 1
  cb_max_hamming: 1

# ── Whitelist QC thresholds ──
whitelist:
  min_umi: 1000
  min_genes: 500

# ── Resources ──
resources:
  simpleaf_quant_threads: 12
  simpleaf_index_threads: 4
  hash_quant_threads: 4
